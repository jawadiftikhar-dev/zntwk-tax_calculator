apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
spec:
  workspaces:
    - name: output
  params:
    - name: url
    - name: revision
      default: main
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      script: |
        set -e
        git clone $(params.url) .
        git checkout $(params.revision)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npminstall
spec:
  workspaces:
    - name: output
  steps:
    - name: npminstall
      image: node:20-buster-slim
      workingDir: $(workspaces.output.path)
      script: |
        set -e

        echo "***** Environment *****"
        npm --version
        pwd

        echo "***** Cleaning npm cache *****"
        npm cache clean --force

        echo "***** Running npm install *****"
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: output
  steps:
    - name: jasmine
      image: node:20-buster-slim
      workingDir: $(workspaces.output.path)
      script: |
        set -e

        echo "***** Running jasminetests *****"
        npx jasmine
